# =====================================================================
# Perfil "test" — base de datos en memoria para las pruebas de integración
# =====================================================================
# La aplicación de desarrollo usa PostgreSQL (delivery_db). Este perfil
# sustituye esa base por H2 en memoria para que las pruebas sean
# reproducibles, rápidas y no ensucien datos reales.

# H2 en memoria. DB_CLOSE_DELAY=-1 mantiene la base viva mientras
# exista la JVM; sin esto, H2 la destruye al cerrar la última conexión.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea el esquema al arrancar el contexto y lo elimina al
# terminar la clase de pruebas.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# No ejecutar schema.sql / data.sql: cada prueba decide qué sembrar
# con @Sql y se encarga de limpiar lo que insertó.
spring.sql.init.mode=never
